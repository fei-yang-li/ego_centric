[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egocentric-vla-dataset"
version = "0.1.0"
description = "Build VLA training records from first-person handheld video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Egocentric VLA Dataset Contributors" }
]
dependencies = [
  "numpy",
  "opencv-python"
]

[project.optional-dependencies]
vision = [
  "mediapipe"
]
dev = []

[project.scripts]
ego-vla = "ego_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
